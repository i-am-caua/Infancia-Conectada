<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Roblox: jogar com o acompanhamento da família</title>
  <desc id="description">Celular com a marca branca do Roblox sobre uma tela verde escura, cercado por um controle de videogame, um relógio, um escudo e dois perfis em um balão de conversa. Ajustes na tela e linhas pontilhadas representam o acompanhamento familiar.</desc>
  <defs>
    <linearGradient id="outer-arch" x1="600" y1="72" x2="600" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4c9054"/>
      <stop offset=".55" stop-color="#388044"/>
      <stop offset="1" stop-color="#176b2d"/>
    </linearGradient>
    <linearGradient id="inner-arch" x1="570" y1="145" x2="570" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91ba80"/>
      <stop offset=".55" stop-color="#71a56b"/>
      <stop offset="1" stop-color="#176b2d"/>
    </linearGradient>
  </defs>
  <path fill="#176b2d" d="M0 0h1200v720H0z"/>
  <path d="M132 690V408C132 222 283 72 469 72h262c186 0 337 150 337 336v282H132Z" fill="url(#outer-arch)"/>
  <path d="M331 690V389c0-132 107-239 239-239s239 107 239 239v301H331Z" fill="url(#inner-arch)"/>

  <!-- Conexões entre o jogo, a rotina e os responsáveis. -->
  <path d="M342 239c23-95 110-139 189-127M739 162c85-25 152 8 180 61M902 296c39 26 47 61 34 99M831 582c-7 53-41 77-84 78M294 500c-4 71 60 117 134 109" stroke="#c3ddb2" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 13"/>
  <path d="M217 349h22m-11-11v22M967 496h18m-9-9v18" stroke="#c3ddb2" stroke-width="4" stroke-linecap="round"/>
  <circle cx="941" cy="137" r="5" fill="#c3ddb2"/>
  <circle cx="366" cy="150" r="5" fill="#c3ddb2"/>
  <circle cx="977" cy="355" r="4" fill="#c3ddb2"/>

  <!-- Balão com uma conversa: sem simular mensagens reais. -->
  <g transform="rotate(-8 308 262)">
    <path d="M263 212h95c13 0 23 10 23 23v52c0 13-10 23-23 23h-55l-28 23v-23h-12c-13 0-23-10-23-23v-52c0-13 10-23 23-23Z" fill="#dcebd2" stroke="#125523" stroke-width="5" stroke-linejoin="round"/>
    <path d="M267 242h85M267 265h59" stroke="#176b2d" stroke-width="7" stroke-linecap="round"/>
    <circle cx="351" cy="281" r="5" fill="#2f9e41"/>
  </g>

  <!-- Perfis do adulto e da criança em uma conversa compartilhada. -->
  <path d="M806 163h99c17 0 30 13 30 30v69c0 17-13 30-30 30h-20l-27 23v-23h-52c-17 0-30-13-30-30v-69c0-17 13-30 30-30Z" fill="#f9fff8" stroke="#125523" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="831" cy="211" r="20" fill="#dcebd2" stroke="#176b2d" stroke-width="4"/>
  <path d="M797 264v-5c0-20 15-33 34-33s34 13 34 33v5" fill="#dcebd2" stroke="#176b2d" stroke-width="4" stroke-linecap="round"/>
  <circle cx="887" cy="223" r="15" fill="#c3ddb2" stroke="#176b2d" stroke-width="4"/>
  <path d="M861 264v-4c0-15 11-25 26-25s26 10 26 25v4" fill="#c3ddb2" stroke="#176b2d" stroke-width="4" stroke-linecap="round"/>

  <!-- Aparelho central. A tela é conceitual, não uma captura do aplicativo. -->
  <rect x="451" y="98" width="282" height="520" rx="39" fill="#125523"/>
  <rect x="443" y="89" width="282" height="520" rx="39" fill="#f9fff8" stroke="#125523" stroke-width="7"/>
  <rect x="460" y="106" width="248" height="486" rx="26" fill="#125523"/>
  <rect x="542" y="119" width="75" height="10" rx="5" fill="#dcebd2"/>
  <circle cx="635" cy="124" r="5" fill="#91ba80"/>
  <path d="M550 578h68" stroke="#dcebd2" stroke-width="5" stroke-linecap="round"/>

