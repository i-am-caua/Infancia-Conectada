<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Conversas protegidas — controle parental no WhatsApp</title>
  <desc id="desc">Ilustração vetorial de um celular com o símbolo do WhatsApp e um grande cadeado amarelo. Um adulto e uma criança conectados por uma linha representam o acompanhamento familiar.</desc>

  <!-- Fundo e formas orgânicas. -->
  <path fill="#176b2d" d="M0 0h960v560H0z"/>
  <path d="M182 560V291C182 139 294 60 446 60h75c159 0 256 109 256 258v242H182Z" fill="#398052"/>
  <circle cx="484" cy="279" r="164" fill="#93BE83"/>
  <ellipse cx="505" cy="484" rx="250" ry="23" fill="#0C482F" opacity=".3"/>

  <!-- Ligne de connexion entre les deux profils. -->
  <path d="M686 157c-62-86-137-93-208-64M742 244c32 66 24 114-8 150" stroke="#BBDBA7" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12"/>

  <!-- Famille : deux profils dans une bulle. -->
  <g transform="translate(662 123)">
    <path d="M20 0h81c12 0 22 10 22 22v48c0 12-10 22-22 22H47L25 109V92h-5C8 92-2 82-2 70V22C-2 10 8 0 20 0Z" fill="#C9E3B8"/>
    <circle cx="43" cy="30" r="12" fill="#397651"/>
    <path d="M21 69v-4c0-13 10-22 22-22s22 9 22 22v4" fill="#397651"/>
    <circle cx="83" cy="40" r="9" fill="#689764"/>
    <path d="M66 69v-2c0-10 7-17 17-17s17 7 17 17v2" fill="#689764"/>
  </g>

  <!-- Téléphone, légèrement incliné. -->
  <g transform="rotate(-9 429 279)">
    <rect x="327" y="78" width="216" height="411" rx="34" fill="#164B32" opacity=".35"/>
    <rect x="319" y="67" width="216" height="411" rx="34" fill="#F9FFF8" stroke="#174F35" stroke-width="5"/>
    <rect x="332" y="80" width="190" height="385" rx="23" fill="#E9F3E4"/>
    <rect x="396" y="87" width="62" height="8" rx="4" fill="#20573C"/>
    <circle cx="470" cy="91" r="4" fill="#90B79B"/>
    <path d="M406 451h43" stroke="#9BBC9F" stroke-width="4" stroke-linecap="round"/>

    <!-- WhatsApp : bulle blanche et combiné téléphonique. -->
    <rect x="357" y="145" width="140" height="140" rx="37" fill="#25D366"/>
    <g transform="translate(374 162) scale(4.42)">
      <path d="M12 2.5C6.753 2.5 2.5 6.753 2.5 12c0 1.8.5 3.55 1.47 5.08L2.6 22l5.02-1.32A9.5 9.5 0 0 0 12 21.5c5.247 0 9.5-4.253 9.5-9.5S17.247 2.5 12 2.5Z" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.198.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.297-.497.1-.198.05-.372-.025-.52-.074-.15-.668-1.612-.916-2.207-.242-.579-.487-.5-.67-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479s1.065 2.876 1.213 3.074c.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347Z" fill="white"/>
    </g>

    <!-- Cartes de conversation. -->
    <rect x="354" y="314" width="144" height="42" rx="12" fill="#FFFFFF"/>
    <circle cx="374" cy="335" r="7" fill="#9ABE8D"/>
    <path d="M392 330h82m-82 11h55" stroke="#B5CDB0" stroke-width="5" stroke-linecap="round"/>
    <rect x="375" y="368" width="122" height="40" rx="12" fill="#CDE5BF"/>
    <path d="M391 384h67m-67 10h44" stroke="#86AF7B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Grand cadenas fermé, chevauchant le téléphone. -->
  <g>
    <path d="M560.5 325v-45c0-36 24-62 57-62s57 26 57 62v45" stroke="#174E35" stroke-width="27" stroke-linecap="round"/>
    <path d="M560.5 325v-45c0-36 24-62 57-62s57 26 57 62v45" stroke="#FFF0B7" stroke-width="18" stroke-linecap="round"/>
    <rect x="527" y="312" width="195" height="159" rx="28" fill="#174B32" opacity=".28"/>
    <rect x="520" y="301" width="195" height="159" rx="28" fill="#F5C860" stroke="#174F35" stroke-width="5"/>
    <path d="M544 316h147" stroke="#FFE69E" stroke-width="5" stroke-linecap="round"/>
    <circle cx="617" cy="362" r="16" fill="#5B542C"/>
    <path d="m611 373-6 28a5 5 0 0 0 5 6h15a5 5 0 0 0 5-6l-7-28" fill="#5B542C"/>
    <!-- Petit badge de confirmation. -->
    <circle cx="706" cy="443" r="32" fill="#F6FFF1" stroke="#174F35" stroke-width="4"/>
    <path d="m693 443 9 9 17-20" stroke="#22814E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Détails de protection et accents. -->
  <g transform="translate(215 311)">
    <path d="M0-39c15 11 29 14 29 14V0c0 22-14 37-29 45C-15 37-29 22-29 0v-25S-15-28 0-39Z" fill="#D1E6BE"/>
    <path d="m-11 1 8 8L13-9" stroke="#307149" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M228 124v22m-11-11h22M779 315v16m-8-8h16" stroke="#C5DFB0" stroke-width="4" stroke-linecap="round"/>
  <circle cx="260" cy="420" r="5" fill="#C5DFB0"/>
  <circle cx="618" cy="98" r="4" fill="#C5DFB0"/>
</svg>
