  <path d="M832 520h34" stroke="#91ba80" stroke-width="5" stroke-linecap="round"/>

  <!-- Controle com corpo mais alto, empunhaduras longas e botões circulares. -->
  <rect x="485" y="518" width="48" height="21" rx="9" fill="#125523"/>
  <rect x="635" y="518" width="48" height="21" rx="9" fill="#125523"/>
