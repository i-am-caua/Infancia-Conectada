  <rect x="485" y="422" width="198" height="91" rx="15" fill="#e9f3e4"/>
  <path d="M505 447h77M505 481h102" stroke="#a7bd9c" stroke-width="7" stroke-linecap="round"/>
  <path d="M505 447h35M505 481h68" stroke="#176b2d" stroke-width="7" stroke-linecap="round"/>
  <circle cx="540" cy="447" r="9" fill="#fff" stroke="#176b2d" stroke-width="4"/>
  <circle cx="573" cy="481" r="9" fill="#fff" stroke="#176b2d" stroke-width="4"/>
  <rect x="614" y="435" width="49" height="25" rx="12.5" fill="#176b2d"/>
  <circle cx="650" cy="447.5" r="8" fill="#fff"/>
  <path d="m637 482 8 8 16-18" stroke="#176b2d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Relógio com ponteiros e marcações legíveis. -->
  <circle cx="305" cy="436" r="79" fill="#125523"/>
  <circle cx="305" cy="429" r="79" fill="#f9fff8" stroke="#125523" stroke-width="6"/>
  <circle cx="305" cy="429" r="64" fill="#e9f3e4"/>
  <path d="M305 374v8M360 429h-8M305 484v-8M250 429h8" stroke="#91ba80" stroke-width="5" stroke-linecap="round"/>
  <path d="M305 391v38l27 19" stroke="#176b2d" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="305" cy="429" r="7" fill="#176b2d"/>

  <!-- Escudo em primeiro plano: acompanhamento e proteção. -->
  <path d="M849 351c31 23 61 33 91 37v64c0 60-36 107-91 137-55-30-91-77-91-137v-64c30-4 60-14 91-37Z" fill="#125523" opacity=".25" transform="translate(5 8)"/>
  <path d="M849 344c31 23 61 33 91 37v64c0 60-36 107-91 137-55-30-91-77-91-137v-64c30-4 60-14 91-37Z" fill="#f9fff8" stroke="#125523" stroke-width="6" stroke-linejoin="round"/>
  <path d="M849 366c24 16 48 26 69 31v48c0 45-26 83-69 111-43-28-69-66-69-111v-48c21-5 45-15 69-31Z" fill="#dcebd2"/>
