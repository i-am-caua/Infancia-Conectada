  <path d="M470 619l-10 41M698 619l10 41" stroke="#dce8de" stroke-width="6" stroke-linecap="round"/>
  <path d="M493 542h37M638 542h37" stroke="#dce8de" stroke-width="5" stroke-linecap="round"/>
  <!-- Direcional e quatro botões na mesma linha, afastados das bordas. -->
  <circle cx="505" cy="574" r="25" fill="#e9f3e4"/>
  <path d="M500 555h10v14h14v10h-14v14h-10v-14h-14v-10h14Z" fill="#176b2d" stroke="#176b2d" stroke-width="3" stroke-linejoin="round"/>
  <g stroke="#125523" stroke-width="2">
    <circle cx="663" cy="557" r="8" fill="#2f9e41"/>
    <circle cx="680" cy="574" r="8" fill="#cd191e"/>
    <circle cx="646" cy="574" r="8" fill="#91ba80"/>
    <circle cx="663" cy="591" r="8" fill="#176b2d"/>
  </g>
  <!-- Área central e botões auxiliares, com eixo de simetria em x=584. -->
  <rect x="557" y="546" width="54" height="25" rx="6" fill="#dcebd2" stroke="#a7bd9c" stroke-width="2"/>
  <path d="M541 559h5m76 0h5" stroke="#176b2d" stroke-width="3" stroke-linecap="round"/>
  <circle cx="584" cy="584" r="4" fill="#176b2d"/>
  <!-- Analógicos menores, próximos ao centro e acima do recorte inferior. -->
  <circle cx="551" cy="600" r="17" fill="#dcebd2" stroke="#176b2d" stroke-width="3"/>
  <circle cx="617" cy="600" r="17" fill="#dcebd2" stroke="#176b2d" stroke-width="3"/>
  <circle cx="551" cy="600" r="11" fill="#176b2d"/>
  <circle cx="617" cy="600" r="11" fill="#176b2d"/>
  <path d="M546 596h10M612 596h10" stroke="#91ba80" stroke-width="2" stroke-linecap="round"/>
</svg>
