<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Messenger Kids: conversa e acompanhamento familiar</title>
  <desc id="description">Símbolo do Messenger Kids acima de dois perfis e um pequeno escudo, sobre arcos verdes que desaparecem suavemente no fundo. Ilustração sem texto visível.</desc>
  <defs>
    <!-- O degradê termina no mesmo verde da área de destaque do site. -->
    <linearGradient id="outer-arch" x1="600" y1="72" x2="600" y2="674" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4C9054"/>
      <stop offset=".55" stop-color="#388044"/>
      <stop offset="1" stop-color="#176B2D"/>
    </linearGradient>
    <linearGradient id="inner-arch" x1="600" y1="164" x2="600" y2="674" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91BA80"/>
      <stop offset=".5" stop-color="#71A56B"/>
      <stop offset="1" stop-color="#176B2D"/>
    </linearGradient>
    <linearGradient id="kids-colors" x1="678" y1="166" x2="516" y2="426" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E5FF1F"/>
      <stop offset=".43" stop-color="#61FF47"/>
      <stop offset=".72" stop-color="#00F7A0"/>
      <stop offset="1" stop-color="#00DFDC"/>
    </linearGradient>
  </defs>
  <path fill="#176B2D" d="M0 0h1200v720H0z"/>
  <path d="M132 674V408C132 222 283 72 469 72h262c186 0 337 150 337 336v266H132Z" fill="url(#outer-arch)"/>
  <path d="M361 674V403c0-132 107-239 239-239s239 107 239 239v271H361Z" fill="url(#inner-arch)"/>
  <!-- Conexão discreta, preservando a ideia da ilustração anterior. -->
  <path d="M388 342c38-61 75-81 120-67M753 422c47 29 67 65 75 107" stroke="#C3DDB2" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 13"/>
  <!-- Balão arredondado e símbolo redesenhados a partir da tela do aplicativo. -->
  <path d="M600 151c-84 0-145 60-145 140 0 47 18 84 48 111l2 31c0 11 8 17 18 12l31-15c15 4 30 6 46 6 84 0 145-61 145-143 0-82-61-142-145-142Z" fill="url(#kids-colors)" stroke="#111A14" stroke-width="11" stroke-linejoin="round"/>
  <path d="M516 327l49-68c7-10 15-12 25-5l36 26 41-31c13-10 26 3 16 16l-47 66c-7 10-17 12-27 5l-36-26-41 30c-13 10-26 0-16-13Z" fill="#FFFFFF" stroke="#111A14" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dois perfis e o escudo mantêm a composição familiar original. -->
  <g fill="#F9FFF8" stroke="#174F35" stroke-width="4.5">
    <circle cx="495" cy="512" r="30"/>
    <path d="M438 594c0-33 25-56 57-56s57 23 57 56" stroke-linecap="round"/>
    <circle cx="705" cy="512" r="30"/>
    <path d="M648 594c0-33 25-56 57-56s57 23 57 56" stroke-linecap="round"/>
    <path d="M600 487c17 11 33 15 33 15v30c0 22-15 38-33 48-18-10-33-26-33-48v-30s16-4 33-15Z" stroke-linejoin="round"/>
  </g>
  <path d="m587 533 9 9 17-20" stroke="#22814E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="418" cy="238" r="6" fill="#F2C45F"/>
  <circle cx="812" cy="359" r="5" fill="#C3DDB2"/>
</svg>
